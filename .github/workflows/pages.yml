name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate PNG icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          ./gradlew :web:generateWebIcons

      - name: Build the static JS bundle
        run: ./gradlew :web:webStandalone --no-daemon

      - name: Stamp the service worker with the commit
        # The browser only looks for a new service worker when sw.js itself has changed, so
        # putting the revision inside it is what makes each deploy a new worker, a new cache,
        # and the end of the one before it. The check afterwards fails the deploy if that line
        # went missing, rather than publishing a worker whose cache never changes.
        run: |
          sed -i "s/const BUILD = 'dev';/const BUILD = '${GITHUB_SHA::12}';/" web/build/dist/js/standalone/sw.js
          grep -q "const BUILD = '${GITHUB_SHA::12}';" web/build/dist/js/standalone/sw.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # The single file build: the scripts are inside index.html, so the site is one
          # document plus its icons, font, manifest and service worker.
          path: web/build/dist/js/standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
