name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle-tasks: jvmTest jsNodeTest linuxX64Test
          - os: macos-14
            # tvOS/watchOS simulator runtimes aren't preinstalled on hosted
            # runners, so their test binaries are linked (compiled) but not run.
            gradle-tasks: macosArm64Test iosSimulatorArm64Test linkDebugTestTvosSimulatorArm64 linkDebugTestWatchosSimulatorArm64
          - os: windows-latest
            gradle-tasks: mingwX64Test

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Test data lives in the qamari submodule under src/test/resources.
          submodules: 'true'
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test with Gradle
        shell: bash
        run: ./gradlew ${{ matrix.gradle-tasks }}

  node-tools:
    name: Node tooling (challenge sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.github/tools/.nvmrc'

      - name: Install and verify the sandbox
        run: |
          npm ci --prefix .github/tools --no-audit --no-fund
          cd .github/tools
          node --no-node-snapshot smoke-test.mjs
